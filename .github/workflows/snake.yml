name: Profile Automation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=orange
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  heatmap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r scripts/requirements.txt

      - name: Fetch Contributions
        env:
          GH_PROFILE_USER: Muntakim23
        run: python scripts/fetch_contributions.py

      - name: Render Heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit Heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution heatmap [skip ci]"
          file_pattern: |
            contrib-heatmap.svg
            data/contributions.json
